name: Closet
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
configFiles:
  Debug: Config/Closet.xcconfig
  Release: Config/Closet.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Closet:
    type: application
    platform: iOS
    sources: [Closet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(CLOSET_BUNDLE_PREFIX).Closet"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: closet
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of clothes to add them to your closet.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconDark"
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 8
  ClosetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClosetTests]
    dependencies:
      - target: Closet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(CLOSET_BUNDLE_PREFIX).ClosetTests"
  ClosetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClosetUITests]
    dependencies:
      - target: Closet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(CLOSET_BUNDLE_PREFIX).ClosetUITests"
schemes:
  Closet:
    build:
      targets:
        Closet: all
    test:
      targets: [ClosetTests, ClosetUITests]
