name: Closet
options:
  bundleIdPrefix: com.eric
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "4535Q45QTY"
targets:
  Closet:
    type: application
    platform: iOS
    sources: [Closet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.Closet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Closet
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of clothes to add them to your closet.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 3
  ClosetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClosetTests]
    dependencies:
      - target: Closet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ClosetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClosetUITests]
    dependencies:
      - target: Closet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Closet:
    build:
      targets:
        Closet: all
    test:
      targets: [ClosetTests, ClosetUITests]
